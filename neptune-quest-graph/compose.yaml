services:
  neptune-local:
    image: tinkerpop/gremlin-server:3.7.3
    ports:
      - "8182:8182"
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 8182"]
      interval: 3s
      timeout: 2s
      retries: 20

  api:
    build: .
    environment:
      GREMLIN_URL: ws://neptune-local:8182/gremlin
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      neptune-local:
        condition: service_healthy
