[project]
name = "today-todo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[dynamodb]>=1.43.72",
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.16.3",
  "ty>=0.0.72",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = [".agents"]

[tool.ruff.lint]
extend-select = ["ANN"]
